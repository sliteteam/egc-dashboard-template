<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Slite EGC · LinkedIn leaderboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23FFF8F1'/%3E%3Ccircle cx='20' cy='38' r='7' fill='%23FF824D'/%3E%3Ccircle cx='32' cy='26' r='7' fill='%23FF824D'/%3E%3Ccircle cx='44' cy='18' r='7' fill='%23FF824D'/%3E%3Cpath d='M16 46c13-2 25-12 32-28' stroke='%2328231D' stroke-width='5' fill='none' stroke-linecap='round' opacity='.75'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --orange:#FF824D; --orange-d:#E0603A; --charcoal:#28231D; --cream:#FDF9F4; --moon:#F9EFE4;
    --blue:#1C8FB0; --pink:#D23F86; --yellow:#B7820A; --lav:#6B4DE6;
    --ink:#28231D; --ink2:#7A6F61; --ink3:#A89A88; --line:#EFE0CE;
    --surface:oklch(0.994 0.004 75); --surface-2:oklch(0.985 0.006 75);
    --up:#1FA463; --down:#E0603A;
    --grad:linear-gradient(90deg,#FF824D,#FE91A3,#FAA3D2,#F8B5FE,#C7C0FE,#9CC9FE,#7FD1FE);
    --disp:"Manrope",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
    --shadow:0 2px 0 #EFE0CE,0 14px 30px -18px rgba(40,35,29,.34);
    --shadow-h:0 3px 0 #EAD9C2,0 22px 40px -20px rgba(40,35,29,.42);
    --r:22px; --ease:cubic-bezier(.16,1,.3,1); --page-max:1180px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; max-width:100%; overflow-x:clip; }  /* clip (not hidden) so position:sticky on .bar2 keeps working */
  body{ font-family:var(--body); color:var(--ink); background:#F6ECDD; -webkit-font-smoothing:antialiased; line-height:1.5; }
  body::before{ content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:linear-gradient(125deg,#FFE2D6 0%,#FFF0F5 26%,#F3E9FF 50%,#E6F6FF 74%,#FDF5DE 100%); opacity:.85; }
  .tnum{ font-variant-numeric:tabular-nums; }
  .cnt{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; }
  /* staggered entrance — applied to top-level blocks per view (containers only, never hover elements) */
  .rv{ opacity:0; transform:translateY(13px); }
  .rv.shown{ opacity:1; transform:none; transition:opacity .6s var(--ease), transform .6s var(--ease); }
  .wrap{ position:relative; z-index:1; max-width:var(--page-max); margin:0 auto; padding:0 20px 90px; }
  .wrap-head{ padding-bottom:0; }
  .bar2 + .wrap{ padding-top:20px; }  /* breathing room between sticky nav and content (was flush at 0) */
  a{ color:inherit; }

  .masthead{ min-height:70px; padding:8px 0 7px; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:10px 18px; }
  .mh-copy{ min-width:0; animation:rise .72s var(--ease) both .04s; }
  .mh-titleline{ display:flex; align-items:center; gap:13px; min-width:0; }
  h1{ flex:none; font-family:var(--disp); font-weight:800; letter-spacing:-.035em; font-size:clamp(28px,4.2vw,38px); margin:0; line-height:.94; }
  h1 .ac{ color:var(--orange); }
  .mh-actions{ display:flex; justify-content:flex-end; align-items:center; gap:8px; flex-wrap:wrap; animation:rise .72s var(--ease) both .14s; }
  .mh-badge{ display:inline-flex; align-items:center; gap:7px; font-family:var(--disp); font-weight:800; font-size:12.5px; color:var(--ink); background:var(--surface); border:1px solid color-mix(in srgb,var(--orange) 30%, var(--line)); border-radius:999px; padding:6px 13px 6px 7px; box-shadow:var(--shadow); white-space:nowrap; text-decoration:none; }
  .mh-badge:hover{ box-shadow:var(--shadow-h); transform:translateY(-1px); }
  .slite-mark{ width:21px; height:22px; display:grid; place-items:center; color:var(--orange); }
  .slite-mark svg{ width:18px; height:19px; display:block; fill:currentColor; }
  .gradrule{ flex:1; min-width:90px; max-width:220px; height:4px; border-radius:6px; background:var(--grad); transform-origin:left center; animation:track 1.05s var(--ease) both .1s; }
  @keyframes track{ from{ transform:scaleX(0); opacity:.4; } to{ transform:scaleX(1); opacity:1; } }
  @keyframes rise{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }
  .lede{ font-size:12.5px; color:var(--ink2); margin:4px 0 0; line-height:1.24; }
  .lede b{ color:var(--ink); font-weight:700; }
  .repo-chip{ display:inline-flex; align-items:center; gap:7px; flex-wrap:wrap; max-width:100%; padding:6px 10px; border-radius:999px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); color:var(--ink2); font-size:12.5px; font-weight:750; text-decoration:none; white-space:nowrap; }
  .repo-chip:hover{ color:var(--ink); box-shadow:var(--shadow-h); transform:translateY(-1px); }
  .repo-chip svg{ width:16px; height:16px; flex:none; fill:currentColor; }

  .bar2{ position:sticky; top:0; z-index:60; background:rgba(247,238,224,.92); backdrop-filter:blur(10px) saturate(150%); border-bottom:1px solid var(--line); }
  .bar2-in{ max-width:var(--page-max); margin:0 auto; padding:6px 20px; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:8px 16px; }
  .bar2-right{ justify-self:end; display:flex; align-items:center; gap:10px; min-width:max-content; }
  .updated{ font-size:11.5px; color:var(--ink3); white-space:nowrap; }
  .seg{ display:inline-flex; gap:3px; background:rgba(40,35,29,.07); border-radius:11px; padding:3px; }
  .seg button{ font-family:var(--body); font-weight:600; font-size:12.5px; color:var(--ink2); background:transparent; border:0; padding:6px 11px; border-radius:9px; cursor:pointer; transition:.14s; }
  .seg button:hover{ color:var(--ink); }
  .seg button[aria-selected="true"]{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
  .subtabs{ display:flex; gap:3px; flex-wrap:nowrap; min-width:0; overflow-x:auto; overscroll-behavior-inline:contain; scrollbar-width:none; padding:2px 0; }
  .subtabs::-webkit-scrollbar{ display:none; }
  .subtabs button{ font-family:var(--disp); font-weight:700; font-size:13.5px; color:var(--ink2); background:transparent; border:0; padding:8px 13px; cursor:pointer; border-radius:10px; transition:background .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease); white-space:nowrap; }
  .subtabs button:hover{ color:var(--ink); background:color-mix(in srgb,var(--ink) 6%, transparent); }
  .subtabs button[aria-selected="true"]{ color:var(--orange-d); background:color-mix(in srgb,var(--orange) 15%, var(--surface)); box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--orange) 36%, transparent); }
  .subtabs button[aria-selected="true"]:hover{ color:var(--orange-d); background:color-mix(in srgb,var(--orange) 19%, var(--surface)); }
  .view{ display:none; } .view.on{ display:block; animation:fade .35s var(--ease); }
  @keyframes fade{ from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }

  .kpis{ display:grid; grid-template-columns:repeat(4,1fr); background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); margin-bottom:18px; overflow:hidden; }
  .kpi{ padding:14px 18px; border-left:1px solid var(--line); min-width:0; }
  .kpi:first-child{ border-left:0; }
  .kpi .k{ font-size:11.5px; color:var(--ink3); font-weight:600; }
  .kpi .v{ font-family:var(--disp); font-weight:800; font-size:25px; letter-spacing:-.03em; margin-top:5px; }
  .kpi .d{ font-size:12px; font-weight:650; margin-top:5px; }
  .up{ color:var(--up); } .down{ color:var(--down); } .flat{ color:var(--ink3); }
  .kpi .d .base{ color:var(--ink3); font-weight:500; }

  .podium{ display:grid; grid-template-columns:1fr 1.18fr 1fr; gap:12px; align-items:end; margin-bottom:14px; }
  .pod{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px 12px 16px; text-align:center; box-shadow:var(--shadow); position:relative; transition:transform .18s var(--ease),box-shadow .18s var(--ease); }
  .pod:hover{ transform:translateY(-3px); box-shadow:var(--shadow-h); }
  .pod.p1{ padding-top:24px; background:color-mix(in srgb,var(--pc) 6%, var(--surface)); border-color:color-mix(in srgb,var(--pc) 30%, var(--line)); box-shadow:var(--shadow),0 0 0 3px color-mix(in srgb,var(--pc) 22%, transparent); }
  .pod.p1:hover{ box-shadow:var(--shadow-h),0 0 0 3px color-mix(in srgb,var(--pc) 32%, transparent); }
  .pod .crown{ font-size:24px; }
  .pod .pa{ width:64px; height:64px; border-radius:50%; object-fit:cover; margin:6px auto 8px; border:3px solid var(--pc); display:block; }
  .pod.p1 .pa{ width:86px; height:86px; }
  .pod .pn{ font-family:var(--disp); font-weight:700; font-size:15px; color:color-mix(in srgb,var(--pc) 80%, var(--ink)); }
  .pod .pr{ font-family:var(--disp); font-weight:800; font-size:25px; letter-spacing:-.02em; margin-top:3px; }
  .pod.p1 .pr{ font-size:30px; }
  .pod .pg{ font-size:11.5px; color:var(--ink3); margin-top:2px; }

  .board{ background:var(--surface); border:1px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:var(--shadow); }
  .brow{ display:grid; grid-template-columns:34px 46px 1fr 160px 96px 92px; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); transition:background .15s var(--ease); }
  .brow:last-child{ border-bottom:0; }
  .brow.data:hover{ background:color-mix(in srgb,var(--pc) 7%, transparent); }
  .brow.lead{ background:color-mix(in srgb,var(--pc) 5%, transparent); }
  .bhead{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink3); font-weight:700; }
  .bhead .r,.brow .r{ text-align:right; }
  .brk{ font-family:var(--disp); font-weight:800; font-size:17px; color:var(--ink3); text-align:center; }
  .brow.lead .brk{ color:var(--orange); }
  .ba{ width:38px; height:38px; border-radius:50%; object-fit:cover; border:2.5px solid var(--pc); }
  .bn{ font-family:var(--disp); font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bsub{ font-size:11.5px; color:var(--ink3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .reachcell{ text-align:right; } .reachcell .rb{ font-family:var(--disp); font-weight:800; font-size:17px; letter-spacing:-.02em; }
  .rbar{ height:6px; border-radius:6px; background:color-mix(in srgb,var(--pc) 20%, #fff); margin-top:6px; overflow:hidden; }
  .rbar>i{ display:block; height:100%; width:0; background:var(--pc); border-radius:6px; transition:width .9s var(--ease); }
  .bnum{ text-align:right; font-weight:650; font-size:14px; } .bnum small{ color:var(--ink3); font-weight:500; font-size:11px; }
  .bdelta{ text-align:right; font-weight:700; font-size:13px; }
  .quiet{ padding:11px 16px; font-size:12px; color:var(--ink3); background:rgba(40,35,29,.04); }

  /* bar chart race */
  .race-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px 16px; flex-wrap:wrap; margin-bottom:14px; padding:0 2px; }
  .race-head .t{ font-family:var(--disp); font-weight:800; font-size:clamp(17px,2.6vw,21px); letter-spacing:-.02em; }
  .race-head .t small{ font-weight:500; color:var(--ink3); font-size:12.5px; display:block; margin-top:3px; }
  .race-card{ position:relative; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px 20px 20px; box-shadow:var(--shadow); }
  .race-cardtop{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; min-height:6px; }
  .race-cap{ font-family:var(--disp); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink3); padding-top:8px; }
  .race-month{ font-family:var(--disp); font-weight:800; font-size:clamp(30px,5.4vw,52px); letter-spacing:-.04em; color:var(--orange); line-height:.85; text-align:right; transform-origin:right center; }
  .race-btn{ font-family:var(--body); font-weight:650; font-size:13px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:8px 16px; cursor:pointer; box-shadow:var(--shadow); }
  .race-track{ position:relative; margin-top:18px; }
  .rrow{ position:absolute; left:0; right:0; height:var(--rh,44px); display:flex; align-items:center; gap:12px; transition:transform .55s var(--ease); will-change:transform; }
  .rrow .rfa{ width:40px; height:40px; border-radius:50%; object-fit:cover; border:3px solid var(--pc); flex:none; z-index:2; box-shadow:0 2px 6px -2px rgba(40,35,29,.35); }
  .rrow .rbarwrap{ position:relative; flex:1; height:var(--bh,30px); }
  .rrow .rbar2{ position:absolute; left:0; top:0; bottom:0; min-width:8px; background:var(--pc); border-radius:9px; display:flex; align-items:center; box-shadow:inset 0 -2px 0 rgba(0,0,0,.09); }
  .rrow .rbar2.win{ animation:winpulse .85s var(--ease) 2; }
  .rrow .rname{ position:absolute; left:13px; font-family:var(--disp); font-weight:700; font-size:14px; color:#fff; white-space:nowrap; text-shadow:0 1px 2px rgba(0,0,0,.28); }
  .rrow .rname.out{ left:calc(100% + 9px); color:var(--ink); text-shadow:none; }  /* short bar: name beside it in dark, not overflowing in white */
  .rrow .rval{ font-family:var(--disp); font-weight:800; font-size:17px; color:var(--ink); margin-left:12px; min-width:64px; }
  .race-crown{ position:absolute; left:7px; top:-15px; font-size:24px; z-index:6; pointer-events:none; filter:drop-shadow(0 2px 3px rgba(40,35,29,.3)); }
  .race-crown.pop{ animation:crownpop .55s var(--ease); }
  @keyframes crownpop{ 0%{ transform:translateY(0) scale(1) rotate(0) } 35%{ transform:translateY(-11px) scale(1.32) rotate(-11deg) } 65%{ transform:translateY(-2px) scale(1.05) rotate(7deg) } 100%{ transform:translateY(0) scale(1) rotate(0) } }
  @keyframes winpulse{ 0%{ box-shadow:inset 0 -2px 0 rgba(0,0,0,.09),0 0 0 0 color-mix(in srgb,var(--pc) 55%, transparent) } 100%{ box-shadow:inset 0 -2px 0 rgba(0,0,0,.09),0 0 0 17px transparent } }
  .race-month.pop{ animation:mpop .42s var(--ease); }
  @keyframes mpop{ 0%{ transform:scale(1) } 42%{ transform:scale(1.16) } 100%{ transform:scale(1) } }
  .confetti{ position:absolute; width:7px; height:11px; border-radius:2px; z-index:7; pointer-events:none; opacity:0; animation:conf 1.05s var(--ease) forwards; }
  @keyframes conf{ 0%{ opacity:1; transform:translate(0,0) rotate(0) } 100%{ opacity:0; transform:translate(var(--dx),var(--dy)) rotate(260deg) } }

  .race-ctrls{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:12px 0 4px; }
  .race-ctrls .seg{ background:rgba(40,35,29,.06); }
  .race-bump{ position:relative; width:100%; }
  .race-bump svg{ display:block; width:100%; overflow:visible; }
  .race-bump .yl{ font-size:11px; fill:var(--ink3); font-family:var(--body); }
  .race-bump .xl{ font-size:10.5px; fill:var(--ink3); font-family:var(--body); text-anchor:middle; }
  .race-bump .ln{ fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; opacity:.55; }
  .face{ position:absolute; width:36px; height:36px; border-radius:50%; transform:translate(-50%,-50%); border:3px solid var(--pc); background:var(--surface); box-shadow:var(--shadow); z-index:2; }
  .face img{ width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }
  .face .bdg{ position:absolute; right:-6px; top:-6px; width:18px; height:18px; border-radius:50%; background:var(--pc); color:#fff; font-size:10px; font-weight:800; display:grid; place-items:center; font-family:var(--disp); border:1.5px solid #fff; }
  .face .fcrown{ position:absolute; left:50%; top:-17px; transform:translateX(-50%); font-size:18px; filter:drop-shadow(0 2px 2px rgba(40,35,29,.3)); pointer-events:none; }
  .face.win{ animation:facepulse 1s var(--ease) 2; }
  @keyframes facepulse{ 0%{ box-shadow:var(--shadow),0 0 0 0 color-mix(in srgb,var(--pc) 55%, transparent) } 100%{ box-shadow:var(--shadow),0 0 0 15px transparent } }
  .race-legend{ display:flex; flex-wrap:wrap; gap:8px 14px; padding:14px 2px 2px; }
  .lg{ display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; }
  .lg .sw{ width:14px; height:14px; border-radius:4px; background:var(--pc); }

  /* grand prix — single blended timeline race: X=time, Y=smart-scaled reach */
  .gp{ position:relative; width:100%; }
  .gp svg{ display:block; width:100%; overflow:visible; }
  .gp .xl{ font-size:10.5px; fill:var(--ink3); font-family:var(--body); text-anchor:middle; }
  .gp .trail{ fill:none; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; opacity:.4; }
  .gp .fin{ stroke:var(--ink3); stroke-width:1.5; stroke-dasharray:5 6; opacity:.5; }
  .gp .finlabel{ font-family:var(--disp); font-weight:800; font-size:11px; fill:var(--ink3); text-anchor:middle; letter-spacing:.04em; }
  .kart{ position:absolute; transform:translate(-50%,-50%); z-index:3; pointer-events:none; transition:none; }
  .kart img{ border-radius:50%; object-fit:cover; border:3px solid var(--pc); box-shadow:0 3px 9px -2px rgba(40,35,29,.42); display:block; }
  .kart .knum{ position:absolute; left:calc(100% + 7px); top:50%; transform:translateY(-50%); font-family:var(--disp); font-weight:800; font-size:12.5px; color:color-mix(in srgb,var(--pc) 78%, var(--ink)); white-space:nowrap; }
  .kart .kcrown{ position:absolute; left:50%; bottom:calc(100% - 3px); transform:translateX(-50%); font-size:18px; filter:drop-shadow(0 2px 2px rgba(40,35,29,.3)); }
  .kart .kcrown.pop{ animation:crownpop .5s var(--ease); }
  .kart.win img{ animation:facepulse 1s var(--ease) 2; }

  /* trends — small multiples (over-time area charts) */
  .trend-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .trend-head .tt-title{ font-family:var(--disp); font-weight:800; font-size:16px; letter-spacing:-.02em; }
  .trend-head .updated{ white-space:normal; text-align:right; line-height:1.35; max-width:620px; }
  .tt{ background:var(--surface); border:1px solid var(--line); border-radius:18px; overflow:visible; box-shadow:var(--shadow); padding:4px 16px 10px; }
  .sm{ padding:14px 2px 4px; border-top:1px solid var(--line); }
  .sm:first-child{ border-top:0; padding-top:8px; }
  .sm-head{ display:flex; align-items:center; gap:9px; margin-bottom:2px; }
  .sm-head .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .sm-head .name{ font-family:var(--disp); font-weight:800; font-size:14px; letter-spacing:-.01em; }
  .sm-head .now{ margin-left:auto; display:flex; align-items:baseline; gap:7px; }
  .sm-head .now .pl{ font-size:10.5px; color:var(--ink3); font-weight:600; }
  .sm-head .now .v{ font-family:var(--disp); font-weight:800; font-size:17px; letter-spacing:-.02em; }
  .sm-head .now .d2{ font-weight:700; font-size:12px; }
  .sm svg{ display:block; width:100%; height:auto; overflow:visible; }
  .sm text{ font-family:var(--body); }
  .sm .pt{ cursor:crosshair; }
  .sm .pt .hit{ fill:rgba(255,255,255,.001); stroke:transparent; pointer-events:all; }
  .sm .pt .tip{ opacity:0; pointer-events:none; transition:opacity .12s var(--ease), transform .12s var(--ease); }
  .sm .pt:hover .tip,.sm .pt:focus .tip,.sm .pt.hot .tip,.sm .pt .hit:hover + .tip{ opacity:1; }
  .sm .pt:focus{ outline:none; }
  .sm .tip rect{ fill:var(--surface); stroke:var(--line); stroke-width:1; filter:drop-shadow(0 8px 14px rgba(40,35,29,.16)); }
  .team-heat{ background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); margin-bottom:14px; overflow:hidden; }
  .team-heat-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:12px 14px 10px; border-bottom:1px solid var(--line); }
  .team-heat-title{ font-family:var(--disp); font-weight:850; font-size:14.5px; letter-spacing:-.01em; }
  .team-heat-note{ margin-top:2px; color:var(--ink3); font-size:11px; font-weight:650; line-height:1.35; }
  .team-heat-scroll{ overflow:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-inline:contain; padding:10px 14px 12px; }
  .team-heat-grid{ display:grid; grid-template-columns:32px repeat(var(--weeks),10px); grid-template-rows:15px repeat(7,10px); gap:3px 5px; min-width:max-content; align-items:center; }
  .team-month{ grid-row:1; align-self:end; color:var(--ink); font-size:10.5px; font-weight:750; white-space:nowrap; transform:translateX(-2px); }

<script>const DATA = __DATA__;</script>
<script>
(function(){
  var SUBS=[["board","🏆 Leaderboard"],["topposts","🔥 Top posts"],["race","🏁 Reach race"],["trends","📈 Team level"],["poster","👤 Per poster"]];
  var PERIODS=["7d","30d","90d","all"]; var PS={ "7d":"7D","30d":"30D","90d":"90D","180d":"180D","all":"ALL TIME" };
  var PL={ "7d":"last 7 days","30d":"last 30 days","90d":"last 90 days","180d":"last 180 days","all":"all time" };
  var PPREV={ "7d":"prev 7d","30d":"prev 30d","90d":"prev 90d","180d":"prev 180d" };
  var COL=["#FF824D","#1C8FB0","#6B4DE6","#D23F86","#B7820A","#178F6B","#C2410C","#7C3AED"];
  var state={ sub:"board", period:"30d" };
  var DAY=86400000, NOW=new Date(DATA.generated_at).getTime(), WD={ "7d":7,"30d":30,"90d":90,"180d":180 };
  var ACTIVITY_PERIOD="30d", ACTIVITY_DAYS=30;
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  DATA.members.forEach(function(m,i){ m._i=i; });

  function fmt(n){ n=Number(n)||0; var a=Math.abs(n); if(a>=1e6)return (n/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,"")+"M"; if(a>=1e3)return (n/1e3).toFixed(a>=1e4?0:1).replace(/\.0$/,"")+"k"; return String(Math.round(n)); }
  function full(n){ return (Number(n)||0).toLocaleString("en-US"); }
  // --- count-up: render a numeric value by kind, and emit a span that grows from 0 on reveal ---
  function renderNum(v,k){ v=Number(v)||0; if(k==="full")return full(Math.round(v)); if(k==="pct2")return (v*100).toFixed(2)+"%"; if(k==="fix1")return v.toFixed(1); if(k==="int")return String(Math.round(v)); if(k==="x")return v>0?xrat(v):"—"; return fmt(v); }
  function nspan(v,k){ return '<span class="cnt" data-v="'+(Number(v)||0)+'" data-k="'+k+'">'+renderNum(v,k)+'</span>'; }
  function playCounts(root){ var els=root.querySelectorAll(".cnt"); if(!els.length)return;
    if(reduce){ els.forEach(function(e){ e.textContent=renderNum(+e.dataset.v,e.dataset.k); }); return; }
    var items=[]; els.forEach(function(e){ var k=e.dataset.k, v=+e.dataset.v; if(k==="x"||!isFinite(v)){ e.textContent=renderNum(v,k); return; } items.push({e:e,v:v,k:k}); e.textContent=renderNum(0,k); });
    if(!items.length)return; var dur=1050,t0=null;
    function tick(ts){ if(!t0)t0=ts; var p=Math.min(1,(ts-t0)/dur), e=1-Math.pow(1-p,4); var i;
      for(i=0;i<items.length;i++) items[i].e.textContent=renderNum(items[i].v*e,items[i].k);
      if(p<1) requestAnimationFrame(tick); else for(i=0;i<items.length;i++) items[i].e.textContent=renderNum(items[i].v,items[i].k); }
    requestAnimationFrame(tick); }
  // entrance reveal per view: first visit (or a period change) cascades blocks + grows numbers; revisits snap
  var played={}, doCount=true, introGate=false;
  function revealView(view){ if(introGate)return; var root=document.getElementById("v-"+view); if(!root)return;
    var first=!played[view]; played[view]=true; var blocks=root.querySelectorAll(".rv");
    if(first&&!reduce){ blocks.forEach(function(el,i){ el.style.transitionDelay=(i*70)+"ms"; }); requestAnimationFrame(function(){ blocks.forEach(function(el){ el.classList.add("shown"); }); }); }
    else { blocks.forEach(function(el){ el.style.transitionDelay="0ms"; el.classList.add("shown"); }); }
    if(doCount||first) playCounts(root); doCount=false; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];}); }
  function href(s){ try{ var u=new URL(String(s||""),location.href); return /^https?:$/.test(u.protocol)?esc(u.href):"#"; }catch(e){ return "#"; } }
  function pcol(m){ return COL[m._i%COL.length]; }
  function st(m,p){ return m.periods[p||state.period]||{posts:0,impressions:0,engagements:0,likes:0,comments:0,reposts:0,eng_rate:0,avg:{}}; }
  function engPP(m,p){ var a=st(m,p).avg||{}; return Math.round((a.likes||0)+(a.comments||0)+(a.reposts||0)); }
  function reachPP(m,p){ var s=st(m,p); return s.posts>0?Math.round(s.impressions/s.posts):0; }
  function active(p){ return DATA.members.map(function(m){return {m:m,s:st(m,p)};}).filter(function(r){return r.s.posts>0;}).sort(function(a,b){return b.s.impressions-a.s.impressions;}); }
  function dposts(m){ var seen={},o=[]; Object.values(m.periods||{}).forEach(function(p){(p.top_posts||[]).forEach(function(t){ if(seen[t.urn])return; seen[t.urn]=1; o.push({t:new Date(t.posted_at).getTime(),imp:t.impressions||0,eng:(t.likes||0)+(t.comments||0)+(t.reposts||0)});});}); return o; }
  function vsPrev(m,key){ var w=state.period; if(w==="all"||!WD[w])return null; var span=WD[w]*DAY,c=0,p=0; dposts(m).forEach(function(x){ var v=key==="eng"?x.eng:x.imp; if(x.t>=NOW-span)c+=v; else if(x.t>=NOW-2*span)p+=v; }); return p>0?(c-p)/p:(c>0?null:0); }
  function teamVsPrev(key){ var w=state.period; if(w==="all"||!WD[w])return null; var span=WD[w]*DAY,c=0,p=0; DATA.members.forEach(function(m){ dposts(m).forEach(function(x){ var v=key==="eng"?x.eng:(key==="posts"?1:x.imp); if(x.t>=NOW-span)c+=v; else if(x.t>=NOW-2*span)p+=v; }); }); return p>0?(c-p)/p:null; }
  function teamTot(p){ var t={impressions:0,engagements:0,posts:0,posters:0}; DATA.members.forEach(function(m){var s=st(m,p); t.impressions+=s.impressions; t.engagements+=s.engagements; t.posts+=s.posts; if(s.posts>0)t.posters++;}); return t; }
  function dchip(d){ if(d==null)return '<span class="flat">new</span>'; var dir=d>0.005?"up":d<-0.005?"down":"flat"; return '<span class="'+dir+'">'+(dir==="up"?"▲":dir==="down"?"▼":"▬")+" "+Math.abs(Math.round(d*100))+"%</span>"; }
  function windowsLed(m){ var c=0; DATA.periods.forEach(function(p){ var a=active(p); if(a[0]&&a[0].m===m)c++; }); return c; }
  function bestBy(fn,p){ var b=null,v=-1; DATA.members.forEach(function(m){ if(st(m,p).posts<=0)return; var x=fn(m,p); if(x>v){v=x;b=m;} }); return {m:b,v:v}; }
  function first(m){ return m?esc(m.name.split(" ")[0]):"—"; }
  function months(n){ var base=new Date(NOW),o=[]; for(var i=n-1;i>=0;i--){ var d=new Date(base.getFullYear(),base.getMonth()-i,1); o.push({label:d.toLocaleString("en",{month:"short"}),tipLabel:d.toLocaleString("en",{month:"short",year:"numeric"}),start:d.getTime(),end:new Date(d.getFullYear(),d.getMonth()+1,1).getTime()}); } return o; }
  function reachIn(m,a,b){ var s=0; dposts(m).forEach(function(x){ if(x.t>=a&&x.t<b)s+=x.imp; }); return s; }
  function engIn(m,a,b){ var s=0; dposts(m).forEach(function(x){ if(x.t>=a&&x.t<b)s+=x.eng; }); return s; }
  function postsIn(m,a,b){ var s=0; dposts(m).forEach(function(x){ if(x.t>=a&&x.t<b)s++; }); return s; }
  // --- new metrics (all from data we already fetch) ---
  function followers(m){ return Number(m.followers_total)||0; }
  function rPerF(m,p){ var f=followers(m); return f>0?st(m,p).impressions/f:0; }      // reach ÷ follower (fairness)
  function convRatio(m,p){ var s=st(m,p); return s.likes>0?s.comments/s.likes:0; }      // comments per like (conversation)
  function viral1k(m,p){ var s=st(m,p); return s.impressions>0?s.reposts/s.impressions*1000:0; } // reposts / 1k reach
  function xrat(v){ return (v>=10?Math.round(v):v.toFixed(1))+"×"; }
  var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  function cadence(m){ // posts/week (exact from counts) + best weekday & recency (from dated top posts)
    var p=state.period, s=st(m,p), dp=dposts(m).slice().sort(function(a,b){return a.t-b.t;});
    var wk = p==="all" ? Math.max(1,(NOW-(dp.length?dp[0].t:NOW))/(7*DAY)) : (WD[p]||30)/7;
    var win = p==="all" ? dp : dp.filter(function(x){ return x.t>=NOW-WD[p]*DAY; });
    var byDay={}; win.forEach(function(x){ var d=new Date(x.t).getDay(); (byDay[d]=byDay[d]||[]).push(x.imp); });
    var bestDay=null,bv=-1; Object.keys(byDay).forEach(function(d){ var a=byDay[d],avg=a.reduce(function(x,y){return x+y;},0)/a.length; if(avg>bv){bv=avg;bestDay=+d;} });
    var since = dp.length ? Math.round((NOW-dp[dp.length-1].t)/DAY) : null;
    return { perWeek:s.posts/wk, bestDay:bestDay==null?null:DOW[bestDay], since:since };
  }

  // controls
  var per=document.getElementById("period");
  PERIODS.forEach(function(p){ var b=document.createElement("button"); b.textContent=PS[p]; b.dataset.p=p; b.onclick=function(){state.period=p; doCount=true; sync(); render();}; per.appendChild(b); });
  var subt=document.getElementById("subtabs");
  SUBS.forEach(function(s){ var b=document.createElement("button"); b.textContent=s[1]; b.dataset.s=s[0]; b.onclick=function(){state.sub=s[0]; sync(); show();}; subt.appendChild(b); });
  function validSub(s){ return SUBS.some(function(x){ return x[0]===s; }); }
  function sync(){ per.querySelectorAll("button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.p===state.period);}); subt.querySelectorAll("button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.s===state.sub);}); }
  function show(){ if(!validSub(state.sub)) state.sub="board"; ["board","topposts","race","trends","poster"].forEach(function(v){ document.getElementById("v-"+v).classList.toggle("on",v===state.sub); }); if(state.sub==="board")growBars(); if(state.sub==="race")playRace(); if(state.sub==="trends")growTrend(); revealView(state.sub); }

  function render(){
    var t=teamTot(state.period);
    document.getElementById("lede").innerHTML=(state.period==="all"?"All time, ":"In the "+PL[state.period]+", ")+"<b>"+DATA.members.length+" Sliters</b> reached <b>"+full(t.impressions)+" people</b> across <b>"+t.posts+" posts</b>.";
    renderBoard(); renderTopPosts(); renderTrends(); renderPoster(); renderRaceShell();
    show();
  }

  // ---------- LEADERBOARD ----------
  function renderBoard(){
    var a=active(state.period), lead=a[0], maxR=lead?lead.s.impressions:1, t=teamTot(state.period);
    var kp=[["Reach",t.impressions,"fmt",teamVsPrev("imp")],["Engagements",t.engagements,"fmt",teamVsPrev("eng")],["Posts",t.posts,"int",teamVsPrev("posts")],["Avg reach/post",t.posts?t.impressions/t.posts:0,"fmt",null]];
    var kph='<div class="kpis rv">'+kp.map(function(k){ var d=k[3]==null?'<span class="base">'+(k[0].indexOf("Avg")>-1?"team avg":"&nbsp;")+'</span>':dchip(k[3])+' <span class="base">vs '+(PPREV[state.period]||"—")+'</span>'; return '<div class="kpi"><div class="k">'+k[0]+'</div><div class="v tnum">'+nspan(k[1],k[2])+'</div><div class="d">'+d+'</div></div>'; }).join("")+'</div>';
    var top3=a.slice(0,3), ord=[top3[1],top3[0],top3[2]];
    var pods=ord.map(function(r){ if(!r)return '<div class="pod" style="visibility:hidden"></div>'; var m=r.m,s=r.s,pos=a.indexOf(r)+1;
      return '<div class="pod '+(pos===1?"p1":"")+'" style="--pc:'+pcol(m)+'"><div class="crown">'+(pos===1?"👑":pos===2?"🥈":"🥉")+'</div><img class="pa" src="'+esc(m.photo)+'" alt=""><div class="pn">'+esc(m.name)+'</div><div class="pr tnum">'+nspan(s.impressions,"fmt")+'</div><div class="pg">'+(pos===1?"reach leader":"−"+fmt(lead.s.impressions-s.impressions)+" reach")+'</div></div>'; }).join("");
    var head='<div class="brow bhead"><div></div><div></div><div>Contributor</div><div>Reach</div><div class="r">Posts · eng/post</div><div class="r">vs prev reach</div></div>';
    var rows=a.map(function(r,i){ var m=r.m,s=r.s;
      return '<div class="brow data'+(i===0?" lead":"")+'" style="--pc:'+pcol(m)+'"><div class="brk">'+(i+1)+'</div><img class="ba" src="'+esc(m.photo)+'" alt=""><div style="min-width:0"><div class="bn">'+esc(m.name)+'</div><div class="bsub">'+esc(m.headline||"")+'</div></div>'+
        '<div class="reachcell"><div class="rb tnum">'+nspan(s.impressions,"full")+'</div><div class="rbar"><i data-w="'+Math.max(5,s.impressions/maxR*100)+'"></i></div></div>'+
        '<div class="bnum">'+s.posts+' <small>· '+engPP(m)+'/post</small></div><div class="bdelta">'+dchip(vsPrev(m,"imp"))+'</div></div>'; }).join("");
    var quiet=DATA.members.filter(function(m){return st(m).posts===0;}).map(function(m){return first(m);});
    document.getElementById("v-board").innerHTML=kph+'<div class="podium rv">'+pods+'</div><div class="board rv">'+head+rows+(quiet.length?'<div class="quiet">Cheering from the sidelines this '+PL[state.period]+': '+quiet.join(", ")+'</div>':'')+'</div>';
  }
  function growBars(){ requestAnimationFrame(function(){ document.querySelectorAll("#v-board .rbar>i").forEach(function(b){ b.style.width=b.dataset.w+"%"; }); }); }

  // ---------- TOP POSTS (cross-team best individual posts for the window) ----------
  function renderTopPosts(){
    var p=state.period, all=[];
    DATA.members.forEach(function(m){ (st(m,p).top_posts||[]).forEach(function(t){ if(t&&(t.impressions||0)>0) all.push({m:m,t:t}); }); });
    all.sort(function(a,b){ return (b.t.impressions||0)-(a.t.impressions||0); });
    var top=all.slice(0,12);
    var note='<div class="tp-note rv">The team’s highest-reach individual posts '+(p==="all"?"all time":"in the "+PL[p])+', ranked across everyone.</div>';
    if(!top.length){ document.getElementById("v-topposts").innerHTML=note+'<div class="board"><div class="quiet">No tracked posts in this window yet.</div></div>'; return; }
    var rows=top.map(function(r,i){ var m=r.m,t=r.t;
      var date=new Date(t.posted_at).toLocaleDateString("en",{month:"short",day:"numeric"});
      var txt=esc((t.text||"").replace(/\s+/g," ").trim())||"—";
      return '<div class="tpc'+(i===0?" gold":"")+'" style="--pc:'+pcol(m)+'">'+
        '<div class="tprk">'+(i+1)+'</div>'+
        '<img class="tpfa" src="'+esc(m.photo)+'" alt="">'+
        '<div class="tpmain"><div class="tpwho"><span class="tpname">'+esc(first(m))+'</span><span class="tpdate">'+date+'</span></div>'+
          '<div class="tptext">'+txt+'</div>'+
          '<div class="tpeng"><span>'+fmt(t.likes||0)+' <small>likes</small></span><span>'+fmt(t.comments||0)+' <small>comments</small></span><span>'+fmt(t.reposts||0)+' <small>reposts</small></span></div></div>'+
        '<div class="tpright"><div class="tpreach tnum">'+nspan(t.impressions||0,"fmt")+'<small>reach</small></div>'+
          '<a class="tplink" href="'+href(t.url)+'" target="_blank" rel="noopener">Open ↗</a></div></div>';
    }).join("");
    document.getElementById("v-topposts").innerHTML=note+'<div class="tp-list rv">'+rows+'</div>';
  }

  // ---------- RACE (bars: cumulative reach race · ranks: position bump · weeks/months) ----------
  var raceStyle="bars", raceGrain="months", raceState=null;
  function renderRaceShell(){
    document.getElementById("v-race").innerHTML=
      '<div class="race-head rv"><div class="t" id="raceTitle">The Grand Prix</div>'+
      '<div class="race-ctrls"><button class="race-btn" id="raceReplay">▶ Replay</button></div></div>'+
      '<div class="race-card rv"><div class="race-cardtop"><div class="race-cap">cumulative reach · racing through</div><div class="race-month" id="raceMonth"></div></div><div id="raceBody"></div></div>';
    document.getElementById("raceReplay").onclick=function(){ drawRace(); };
  }
  function buildRaceSeg(id,opts,kind){ var el=document.getElementById(id); opts.forEach(function(o){ var b=document.createElement("button"); b.textContent=o[1]; b.dataset.v=o[0]; b.setAttribute("aria-selected",(kind==="style"?raceStyle:raceGrain)===o[0]); b.onclick=function(){ if(kind==="style")raceStyle=o[0]; else raceGrain=o[0]; el.querySelectorAll("button").forEach(function(z){z.setAttribute("aria-selected",z.dataset.v===(kind==="style"?raceStyle:raceGrain));}); drawRace(); }; el.appendChild(b); }); }
  function shortDate(ms){ return new Date(ms).toLocaleString("en",{month:"short",day:"numeric"}); }
  function weeks(n){ var o=[]; for(var i=n-1;i>=0;i--){ var end=NOW-i*7*DAY, start=end-7*DAY; o.push({label:shortDate(start),start:start,end:end+(i===0?DAY:0)}); } return o; }
  function raceBuckets(){ return (state.period==="7d"||state.period==="30d")? weeks(8) : months(6); }
  function playRace(){ drawRace(); }
  function drawRace(){
    if(raceState&&raceState.raf) cancelAnimationFrame(raceState.raf);
    if(raceState&&raceState.timer) clearTimeout(raceState.timer);

  function teamActivityData(){

      activityPosts(m).forEach(function(x){
        var t=dayStart(x.t);
        if(!isFinite(t))return;
        min=Math.min(min,t);
        var k=dayKey(t), b=by[k]||(by[k]={posts:0,reach:0,eng:0,known:0,dateOnly:0,people:{}});
        b.posts+=1; b.reach+=x.imp; b.eng+=x.eng; dated+=1;

  function activityBucket(m,start,end){

  var rz; window.addEventListener("resize",function(){ clearTimeout(rz); rz=setTimeout(function(){ if(state.sub==="race")playRace(true); },200); });

  var gen=DATA.generated_at?new Date(DATA.generated_at):null;
  if(gen) document.getElementById("updated").textContent="Updated "+gen.toLocaleDateString("en",{month:"short",day:"numeric"});
  if(DATA.source) document.getElementById("sourceLabel").textContent=DATA.source;
  var q=new URLSearchParams(location.search);
  if(q.get("sub")) state.sub=q.get("sub");
  if(q.get("period")) state.period=q.get("period");
  if(!validSub(state.sub)) state.sub="board";
  if(q.get("rstyle")) raceStyle=q.get("rstyle");
  if(q.get("rgrain")) raceGrain=q.get("rgrain");

  // ---------- cold open: roulette through the team, land on the current leader, then reveal the board ----------
  function startIntro(){
    var ov=document.getElementById("intro");
    if(!ov) return revealView(state.sub);
    if(introGate===false){ ov.remove(); return revealView(state.sub); }      // reduced-motion / opted out
    var L=active("7d")[0]||active("30d")[0]||active("90d")[0]||active("all")[0];
    var faces=DATA.members.filter(function(m){ return m.photo; });
    if(!L||!faces.length){ introGate=false; ov.remove(); return revealView(state.sub); }
    var img=document.getElementById("introImg"), faceEl=document.getElementById("introFace");
    var lead=L.m; ov.style.setProperty("--pc",pcol(lead));
    var timers=[], done=false;
    function clearAll(){ timers.forEach(clearTimeout); timers=[]; }
    function finish(){ if(done)return; done=true; clearAll();
      ov.classList.add("out");
      // let the splash lift first, THEN grow the numbers so the count-up plays on a clear board
      timers.push(setTimeout(function(){ introGate=false; doCount=true; revealView(state.sub); },430));
      timers.push(setTimeout(function(){ if(ov.parentNode) ov.remove(); },700)); }
    document.getElementById("introSkip").onclick=finish;
    ov.addEventListener("click",function(e){ if(e.target.id==="introSkip")return; if(!faceEl.classList.contains("reveal")) land(); else finish(); });
    // build a decelerating tick schedule, then land on the leader
    var ticks=[], d=55, total=0; while(total<1250){ ticks.push(d); total+=d; d=Math.min(300,d*1.16); }
    var idx=0, fi=0;
    function spin(){ if(done)return; if(idx>=ticks.length){ land(); return; }
      var m=faces[fi%faces.length]; fi++; img.src=m.photo; ov.style.setProperty("--pc",pcol(m)); idx++;
      timers.push(setTimeout(spin,ticks[idx-1])); }
    function land(){ if(faceEl.classList.contains("reveal"))return; clearAll();
      img.src=lead.photo; ov.style.setProperty("--pc",pcol(lead));
      faceEl.classList.add("reveal");
      document.getElementById("introQ").innerHTML='It&rsquo;s <span class="em">'+first(lead)+'</span>! 🏁';
      var nm=document.getElementById("introName"); nm.textContent=lead.name; nm.classList.add("in");
      var sub=document.getElementById("introSub"); sub.innerHTML='👑 leading the Reach Race with <span class="b">'+fmt(L.s.impressions)+'</span> reach';
      requestAnimationFrame(function(){ sub.classList.add("in"); });
      introBurst(ov);
      timers.push(setTimeout(finish,2700)); }
    img.src=lead.photo;            // preload leader so the landing frame is instant
    timers.push(setTimeout(spin,260));
  }
  function introBurst(ov){ var cols=["#FF824D","#7FD1FE","#F7DF91","#FFD2E1","#6B4DE6","#1FA463","#D23F86"];
    for(var k=0;k<26;k++){ var c=document.createElement("i"); c.className="confetti"; c.style.background=cols[k%cols.length];
      c.style.left="50%"; c.style.top="44%"; var ang=Math.random()*6.283, dist=130+Math.random()*240;
      c.style.setProperty("--dx",(Math.cos(ang)*dist).toFixed(0)+"px"); c.style.setProperty("--dy",(Math.sin(ang)*dist-40).toFixed(0)+"px");
      c.style.animationDelay=(Math.random()*0.12).toFixed(2)+"s"; ov.appendChild(c);
      (function(el){ setTimeout(function(){ if(el.parentNode)el.remove(); },1400); })(c); } }

  introGate = !reduce && q.get("nointro")!=="1";
  sync(); render();
  startIntro();
})();
</script>
</body>
